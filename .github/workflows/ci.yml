name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  dynamodb-integration:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: [8000:8000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: node -e "const wait=async()=>{for(let i=0;i<30;i++){try{await fetch('http://127.0.0.1:8000');return}catch{await new Promise(r=>setTimeout(r,1000))}}throw new Error('DynamoDB Local did not start')};wait()"
      - run: npm run test:integration --workspace=@triviamap/migration

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - run: npm run synth
