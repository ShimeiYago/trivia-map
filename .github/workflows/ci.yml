name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run test:ci --workspace=@triviamap/front
  api-contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run test:ci --workspace=@triviamap/api
  migration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run test:ci --workspace=@triviamap/migration
  dynamodb-integration:
    runs-on: ubuntu-latest
    env:
      MYSQL_URL: mysql://root:fixture-only-password@127.0.0.1:3306/fixture
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-password
          MYSQL_DATABASE: fixture
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfixture-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: node -e "const wait=async()=>{for(let i=0;i<30;i++){try{await fetch('http://127.0.0.1:8000');return}catch{await new Promise(r=>setTimeout(r,1000))}}throw new Error('DynamoDB Local did not start')};wait()"
      - run: npm run test:integration --workspace=@triviamap/api
      - run: npm run test:integration --workspace=@triviamap/migration
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run synth
